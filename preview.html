<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Slot — Preview (celular + computador)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0e0d;
        color: #e7e2db;
        min-height: 100vh;
        padding: 24px;
      }
      header {
        max-width: 1400px;
        margin: 0 auto 20px;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      header p {
        font-size: 0.85rem;
        color: #9a938a;
        margin-top: 4px;
      }
      .palco {
        display: flex;
        gap: 40px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 1400px;
        margin: 0 auto;
      }
      .coluna {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .coluna .rotulo {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9a938a;
      }

      /* Celular */
      .moldura-celular {
        width: 390px;
        height: 780px;
        background: #1a1a1a;
        border-radius: 44px;
        padding: 14px;
        box-shadow:
          0 0 0 2px #333,
          0 30px 60px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .moldura-celular::before {
        content: '';
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 26px;
        background: #1a1a1a;
        border-radius: 0 0 16px 16px;
        z-index: 2;
      }
      .moldura-celular iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 30px;
        background: #fff;
      }

      /* Computador */
      .janela-desktop {
        width: 900px;
        max-width: 100%;
        height: 640px;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      }
      .janela-desktop .barra {
        height: 34px;
        background: #e9e5e0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 14px;
      }
      .janela-desktop .barra span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #c8c2ba;
      }
      .janela-desktop iframe {
        width: 100%;
        height: calc(100% - 34px);
        border: none;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Studio Slot — preview</h1>
      <p>
        O mesmo app rodando ao vivo nas duas larguras. Clique nas duas telas — as duas
        funcionam. Cada mudança no código aparece aqui sozinha.
      </p>
    </header>

    <div class="palco">
      <div class="coluna">
        <div class="moldura-celular">
          <iframe src="http://localhost:5173/" title="App no celular"></iframe>
        </div>
        <span class="rotulo">Celular · 390px</span>
      </div>

      <div class="coluna">
        <div class="janela-desktop">
          <div class="barra"><span></span><span></span><span></span></div>
          <iframe src="http://localhost:5173/" title="App no computador"></iframe>
        </div>
        <span class="rotulo">Computador</span>
      </div>
    </div>
  </body>
</html>
